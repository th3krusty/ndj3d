<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDJ 3D · Ideias que ganham forma</title>
<link rel="icon" href="assets/logo.jpg">
<style>
  :root {
    --bg: #F7EEE7;
    --bg-deep: #EFE2D6;
    --ink: #1c1a18;
    --ink-soft: #6b6259;
    --gold: #b08d57;
    --gold-deep: #8f6f3f;
    --card: #ffffff;
    --card-line: #e7dccd;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    min-height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 48px 16px 64px;
    background:
      radial-gradient(circle at 50% 0%, var(--bg-deep) 0%, var(--bg) 55%);
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 40px 28px 32px;
    box-shadow: 0 30px 60px -25px rgba(60, 45, 25, 0.35), 0 2px 8px rgba(60,45,25,0.06);
    border: 1px solid var(--card-line);
    position: relative;
    overflow: hidden;
  }

  .rodapé {
    text-align: center;
    margin-top: 28px;
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: 0.4px;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -60px;
    right: -60px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(176,141,87,0.10) 0%, rgba(176,141,87,0) 70%);
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .logo-ring {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, var(--gold), #d9bd8e);
    box-shadow: 0 12px 24px -10px rgba(176,141,87,0.55);
  }

  .logo-ring img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--bg);
  }

  .titles {
    text-align: center;
    margin-bottom: 6px;
  }

  .brand {
    font-family: Arial, Helvetica, sans-serif, 'Candara', serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 26px;
    color: var(--ink);
    margin: 0;
  }

  .brand span { color: var(--gold-deep); }

  .tagline {
    margin: 4px 0 0;
    font-size: 13.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .divider {
    width: 40px;
    height: 3px;
    border-radius: 3px;
    background: var(--gold);
    margin: 18px auto 22px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-radius: 16px;
    text-decoration: none;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--card-line);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    font-weight: 600;
    font-size: 15px;
  }

  .link-btn:hover, .link-btn:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -12px rgba(60,45,25,0.35);
    border-color: var(--gold);
    background: #fffdfa;
    outline: none;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }

  .icon svg { width: 24px; height: 24px; display: block; }

  .icon.whatsapp { background: #25D366; }
  .icon.instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .icon.shopee { background: #EE4D2D; }
  .icon.mercadolivre { background: #FFE600; }
  .icon.mercadolivre svg { color: #2D3277; }
  .icon.site { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); }

  .link-text { flex: 1; }
  .link-text .main { display: block; }
  .link-text .sub { display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-top: 1px; }

  .chevron { color: var(--ink-soft); opacity: 0.6; }

  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 11.5px;
    color: var(--ink-soft);
    letter-spacing: 0.4px;
  }

  .footer b { color: var(--gold-deep); }

  @media (prefers-reduced-motion: reduce) {
    .link-btn { transition: none; }
  }
</style>
</head>
