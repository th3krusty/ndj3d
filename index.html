<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDJ 3D — Em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --creme: #F4EEE2;
    --creme-2: #FBF8F2;
    --tinta: #1B1815;
    --tinta-suave: #3A342C;
    --bronze: #B08D57;
    --bronze-escuro: #8A6B3D;
    --bronze-claro: #D8BD8E;
    --linha: #DFD5BF;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Work Sans', sans-serif;
    background: var(--creme);
    color: var(--tinta);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:'';
    position:absolute;
    top:-20%; left:50%;
    width:900px; height:900px;
    transform:translateX(-50%);
    background: radial-gradient(circle, rgba(176,141,87,0.10) 0%, rgba(176,141,87,0) 65%);
    pointer-events:none;
  }
  .cena{
    position:relative;
    max-width:480px;
    width:100%;
    text-align:center;
    z-index:1;
  }
  .logo-aro{
    width:104px; height:104px;
    border-radius:50%;
    margin:0 auto 28px;
    padding:6px;
    background: var(--creme-2);
    border:1px solid var(--linha);
    box-shadow: 0 10px 30px rgba(27,24,21,0.08);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-aro img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  .risca{
    width:36px; height:2px;
    background: var(--bronze);
    margin:0 auto 18px;
  }
  .marca{
    font-family:'Oswald', sans-serif;
    font-size:15px;
    letter-spacing:0.14em;
    color: var(--bronze-escuro);
    margin-bottom:6px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: clamp(30px, 6vw, 44px);
    line-height:1.15;
    color: var(--tinta);
    margin-bottom:16px;
  }
  p.sub{
    font-size:15.5px;
    line-height:1.6;
    color: var(--tinta-suave);
    max-width:360px;
    margin:0 auto 34px;
  }
  .fase{
    position:relative;
    height:3px;
    width:220px;
    margin:0 auto 40px;
    background: var(--linha);
    border-radius:2px;
    overflow:hidden;
  }
  .fase span{
    position:absolute;
    top:0; left:0; height:100%;
    width:38%;
    background: var(--bronze);
    border-radius:2px;
    animation: imprimir 2.6s ease-in-out infinite;
  }
  @keyframes imprimir{
    0%{ left:-38%; }
    50%{ left:100%; }
    50.01%{ left:100%; }
    100%{ left:-38%; }
  }
  .ig{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:12px 22px;
    background: var(--tinta);
    color: var(--creme-2);
    text-decoration:none;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
    letter-spacing:0.02em;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .ig:hover{
    background: var(--bronze-escuro);
    transform: translateY(-1px);
  }
  .ig svg{ width:17px; height:17px; flex-shrink:0; }
  .rodape{
    margin-top:26px;
    font-size:12px;
    color: var(--tinta-suave);
    opacity:0.65;
    letter-spacing:0.03em;
  }
  @media (prefers-reduced-motion: reduce){
    .fase span{ animation:none; left:0; width:100%; }
  }
</style>
</head>
