<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
  <linearGradient id="sensPainel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F4EEE2"/>
    <stop offset="100%" stop-color="#D8BD8E"/>
  </linearGradient>
  <linearGradient id="sensDial" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3A342C"/>
    <stop offset="100%" stop-color="#1B1815"/>
  </linearGradient>
  <linearGradient id="sensDialMiolo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#D8BD8E"/>
    <stop offset="100%" stop-color="#B08D57"/>
  </linearGradient>
  <linearGradient id="sensTrilho" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C79A5E"/>
    <stop offset="100%" stop-color="#8A6B3D"/>
  </linearGradient>
  <filter id="sombraSens" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B1815" flood-opacity="0.28"/>
  </filter>
</defs>

<ellipse cx="60" cy="103" rx="32" ry="7" fill="#1B1815" opacity="0.12"/>

<g filter="url(#sombraSens)">
  <!-- Base / painel sensorial -->
  <rect x="24" y="30" width="72" height="66" rx="10" fill="url(#sensPainel)" stroke="#8A6B3D" stroke-width="1.5"/>

  <!-- Botao giratorio (dial) -->
  <circle cx="42" cy="50" r="12" fill="url(#sensDial)"/>
  <circle cx="42" cy="50" r="6.5" fill="url(#sensDialMiolo)"/>
  <line x1="42" y1="50" x2="42" y2="41" stroke="#F4EEE2" stroke-width="2" stroke-linecap="round"/>

  <!-- Losango giratorio (peca de encaixe) -->
  <rect x="66" y="38" width="18" height="18" rx="3" fill="#B0473F" stroke="#6B4F28" stroke-width="1" transform="rotate(45 75 47)"/>
  <circle cx="75" cy="47" r="3" fill="#F4EEE2"/>

  <!-- Trilho deslizante (slider) -->
  <rect x="34" y="76" width="52" height="10" rx="5" fill="url(#sensTrilho)" stroke="#6B4F28" stroke-width="1"/>
  <circle cx="66" cy="81" r="8" fill="#4C7A50" stroke="#1B1815" stroke-opacity="0.25" stroke-width="1"/>
</g>
</svg>
