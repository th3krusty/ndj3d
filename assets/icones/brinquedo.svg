<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Sombra projetada na base -->
    <ellipse id="base-shadow" cx="50" cy="84" rx="16" ry="3.5" fill="#000000" opacity="0.12" />

    <!-- Gradientes de Madeira/Tons Terrosos -->
    <linearGradient id="wood-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A15C" />
      <stop offset="100%" stop-color="#AA6F39" />
    </linearGradient>

    <linearGradient id="wood-medium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BE8346" />
      <stop offset="100%" stop-color="#8C5123" />
    </linearGradient>

    <linearGradient id="wood-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E3B15" />
      <stop offset="100%" stop-color="#4A2409" />
    </linearGradient>

    <linearGradient id="detail-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBB36E" />
      <stop offset="100%" stop-color="#C5843C" />
    </linearGradient>

    <!-- Filtro de sombra suave de profundidade -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#3D1E0B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sombra no chão -->
  <use href="#base-shadow" />

  <g filter="url(#soft-shadow)">
    <!-- Orelhas (Trás) -->
    <circle cx="35" cy="27" r="7.5" fill="url(#wood-medium)" />
    <circle cx="65" cy="27" r="7.5" fill="url(#wood-medium)" />
    <!-- Interior das Orelhas -->
    <circle cx="35" cy="27" r="4.5" fill="url(#detail-accent)" />
    <circle cx="65" cy="27" r="4.5" fill="url(#detail-accent)" />

    <!-- Patas traseiras / Pés (Trás/Lados) -->
    <ellipse cx="30" cy="72" rx="7.5" ry="9" fill="url(#wood-medium)" />
    <ellipse cx="70" cy="72" rx="7.5" ry="9" fill="url(#wood-medium)" />
    <!-- Solas das Patas -->
    <ellipse cx="30" cy="73" rx="4.5" ry="5.5" fill="url(#detail-accent)" />
    <ellipse cx="70" cy="73" rx="4.5" ry="5.5" fill="url(#detail-accent)" />

    <!-- Corpo -->
    <ellipse cx="50" cy="62" rx="17" ry="16" fill="url(#wood-light)" />
    <!-- Barriguinha -->
    <ellipse cx="50" cy="64" rx="10" ry="9" fill="url(#detail-accent)" opacity="0.6" />

    <!-- Braços (Frente) -->
    <ellipse cx="33" cy="57" rx="5.5" ry="9" transform="rotate(20 33 57)" fill="url(#wood-medium)" />
    <ellipse cx="67" cy="57" rx="5.5" ry="9" transform="rotate(-20 67 57)" fill="url(#wood-medium)" />

    <!-- Cabeça -->
    <circle cx="50" cy="37" r="16.5" fill="url(#wood-light)" />

    <!-- Focinho (Frente) -->
    <ellipse cx="50" cy="42" rx="7" ry="5.5" fill="url(#detail-accent)" />
    
    <!-- Nariz e Boca -->
    <path d="M 47.5 39.5 C 47.5 37.5, 52.5 37.5, 52.5 39.5 C 52.5 41.5, 47.5 41.5, 47.5 39.5 Z" fill="url(#wood-dark)" />
    <path d="M 50 41.5 L 50 44.5 M 48 44.5 Q 50 46 52 44.5" stroke="url(#wood-dark)" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Olhos -->
    <circle cx="43" cy="34" r="2" fill="url(#wood-dark)" />
    <circle cx="57" cy="34" r="2" fill="url(#wood-dark)" />
    <!-- Brilho dos olhos -->
    <circle cx="42.3" cy="33.3" r="0.6" fill="#FFFFFF" />
    <circle cx="56.3" cy="33.3" r="0.6" fill="#FFFFFF" />
  </g>
</svg>
