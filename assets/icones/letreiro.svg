<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
  <linearGradient id="letreiroFrente" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D8BD8E"/>
    <stop offset="55%" stop-color="#B08D57"/>
    <stop offset="100%" stop-color="#8A6B3D"/>
  </linearGradient>
  <linearGradient id="letreiroLateral" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6B4F28"/>
    <stop offset="100%" stop-color="#4A371C"/>
  </linearGradient>
  <linearGradient id="letreiroBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#241F1A"/>
    <stop offset="100%" stop-color="#1B1815"/>
  </linearGradient>
  <filter id="sombraLetreiro" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B1815" flood-opacity="0.28"/>
  </filter>
</defs>

<ellipse cx="60" cy="103" rx="34" ry="7" fill="#1B1815" opacity="0.12"/>

<g filter="url(#sombraLetreiro)">
  <!-- baseinha onde a letra "N" fica de pé, como um letreiro de mesa -->
  <rect x="20" y="90" width="80" height="10" rx="3" fill="url(#letreiroBase)"/>
  <rect x="20" y="90" width="80" height="4" fill="#000" opacity="0.15"/>

  <!-- letra N em bloco (letreiro decorativo), com face frontal clara e
       uma fina borda mais escura simulando a espessura da peça impressa -->
  <path d="M26,90 V26 H43 L77,78 V26 H94 V90 H77 L43,38 V90 Z"
        fill="url(#letreiroFrente)" stroke="#6B4F28" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- confete/estrelinha decorativa, como nos outros ícones de festa -->
  <circle cx="94" cy="16" r="3.5" fill="#D8BD8E"/>
  <circle cx="24" cy="14" r="2.5" fill="#B08D57"/>
</g>
</svg>
