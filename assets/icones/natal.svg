<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Sombra projetada na base -->
    <ellipse id="base-shadow" cx="50" cy="85" rx="16" ry="3.5" fill="#000000" opacity="0.12" />

    <!-- Gradientes para o visual amadeirado/suave em 3D -->
    <linearGradient id="wood-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A15C" />
      <stop offset="100%" stop-color="#AA6F39" />
    </linearGradient>

    <linearGradient id="wood-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C5123" />
      <stop offset="100%" stop-color="#5C3110" />
    </linearGradient>

    <linearGradient id="gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A" />
      <stop offset="100%" stop-color="#E5A93C" />
    </linearGradient>

    <!-- Filtro de sombra suave interna dos elementos -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#3D1E0B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sombra no chão -->
  <use href="#base-shadow" />

  <g filter="url(#soft-shadow)">
    <!-- Troncoc / Base de Madeira Escura -->
    <rect x="45.5" y="70" width="9" height="12" rx="2" fill="url(#wood-dark)" />

    <!-- Camada Inferior da Árvore -->
    <path d="M 28 71 Q 50 64 72 71 L 50 42 Z" fill="url(#wood-light)" />
    
    <!-- Camada Intermediária da Árvore -->
    <path d="M 32 54 Q 50 48 68 54 L 50 28 Z" fill="url(#wood-light)" />

    <!-- Camada Superior da Árvore -->
    <path d="M 36 38 Q 50 33 64 38 L 50 18 Z" fill="url(#wood-light)" />

    <!-- Enfeites / Bolinhas de Natal minimalistas (em tom terroso e dourado) -->
    <circle cx="38" cy="65" r="2.5" fill="#8C5123" />
    <circle cx="50" cy="58" r="2.5" fill="#FFE28A" />
    <circle cx="62" cy="65" r="2.5" fill="#8C5123" />
    
    <circle cx="43" cy="48" r="2" fill="#FFE28A" />
    <circle cx="57" cy="48" r="2" fill="#8C5123" />

    <!-- Estrela do topo -->
    <path d="M 50 10 L 52.2 15.2 L 57.8 15.6 L 53.5 19.3 L 54.8 24.8 L 50 21.9 L 45.2 24.8 L 46.5 19.3 L 42.2 15.6 L 47.8 15.2 Z" fill="url(#gold-star)" />
  </g>
</svg>
