<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<defs>
  <linearGradient id="chaveiroPeca" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C79A5E"/>
    <stop offset="55%" stop-color="#B08D57"/>
    <stop offset="100%" stop-color="#8A6B3D"/>
  </linearGradient>
  <linearGradient id="chaveiroArgola" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#4A433A"/>
    <stop offset="100%" stop-color="#1B1815"/>
  </linearGradient>
  <filter id="sombraChaveiro" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1B1815" flood-opacity="0.28"/>
  </filter>
</defs>

<ellipse cx="62" cy="103" rx="30" ry="7" fill="#1B1815" opacity="0.12"/>

<g filter="url(#sombraChaveiro)">
  <!-- argola metálica -->
  <circle cx="40" cy="34" r="14" fill="none" stroke="url(#chaveiroArgola)" stroke-width="6"/>
  <circle cx="40" cy="34" r="14" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1"/>

  <!-- corrente curta -->
  <rect x="46" y="44" width="9" height="14" rx="4" fill="none" stroke="url(#chaveiroArgola)" stroke-width="4" transform="rotate(30 50 51)"/>

  <!-- peça impressa (formato de etiqueta/plaquinha) -->
  <rect x="42" y="56" width="46" height="46" rx="10" fill="url(#chaveiroPeca)" stroke="#6B4F28" stroke-width="1.5"/>
  <g stroke="#00000022" stroke-width="1">
    <line x1="42" y1="64" x2="88" y2="64"/>
    <line x1="42" y1="72" x2="88" y2="72"/>
    <line x1="42" y1="80" x2="88" y2="80"/>
    <line x1="42" y1="88" x2="88" y2="88"/>
    <line x1="42" y1="96" x2="88" y2="96"/>
  </g>

  <!-- inicial gravada -->
  <text x="65" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F4EEE2">N</text>

  <!-- furo da plaquinha -->
  <circle cx="65" cy="62" r="3.2" fill="#1B1815"/>
</g>
</svg>
